<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>브릿지 커피 메뉴판</title>

  <script>
    /* ==========================================================================
       ★★★ 메뉴 정보는 전부 여기 한곳에 모아 두었어요 ★★★
       메뉴를 추가하거나, 가격·이름·설명을 고치고 싶으면 이 부분만 보세요.
       이 파일의 다른 곳은 건드리지 않아도 돼요.

       ──────────────── 고치는 방법 (꼭 읽어 보세요) ────────────────

       ▶ 메뉴 한 줄은 이렇게 생겼어요 (아래 줄들을 보세요):
           { category: "커피", name: "아메리카노", price: 4500, soldOut: 0, desc: "산미가 적은 고소한 원두" },

           soldOut  = 품절 여부 (0 = 판매 중, 1 = 오늘 품절) ← 아래 '품절 표시' 설명 참고
           category = 어느 칸에 넣을지 ("커피", "논커피", "디저트" 중 하나)
           name     = 메뉴 이름
           price    = 가격 (숫자만! 4500 처럼 쓰고, 쉼표(,)와 '원'은 쓰지 마세요.
                      '4,500원'으로 보이는 건 자동으로 해 줘요)
           desc     = 메뉴 아래에 나오는 한 줄 설명

       ▶ 가격만 바꾸고 싶을 때
           바꿀 메뉴를 찾아서 price: 뒤의 숫자만 고치세요.
           예) 아메리카노를 5,000원으로 → price: 4500 을 price: 5000 으로

       ▶ 이름이나 설명을 바꾸고 싶을 때
           큰따옴표(" ") 안의 글자만 고치세요. 따옴표는 지우면 안 돼요!

       ▶ 메뉴를 새로 추가하고 싶을 때
           1) 추가할 칸의 메뉴 줄 하나를 통째로 복사하세요. ({ 부터 }, 까지)
           2) 같은 칸 메뉴들 맨 아래에 붙여 넣으세요.
           3) 이름, 가격, 설명을 새 메뉴에 맞게 고치세요.
           ※ 줄 맨 끝의 쉼표(,)를 꼭 남겨 주세요!
             (칸 안에서 마지막 줄이 아니라, 전체 목록의 맨 마지막 줄만 쉼표가 없어요)

       ▶ 메뉴를 지우고 싶을 때
           그 메뉴 한 줄을 통째로 지우세요. (한 줄만 지우면 돼요)
           지우기 겁나면, 줄 맨 앞에 // 를 붙이면 잠시 숨겨져요. 나중에 // 만 지우면 다시 나와요.

       ▶ '시그니처 메뉴' 표시를 붙이고 싶을 때
           줄 맨 끝 } 앞에 , best: true 를 붙이세요.
           예) { category: "커피", name: "콜드브루", price: 5300, soldOut: 0, desc: "...", best: true },
           표시를 빼려면 , best: true 를 지우세요.
           (시그니처 메뉴는 카드 테두리가 연두색으로 살짝 더 눈에 띄게 보여요)

       ▶ ★ 품절 표시 켜고 끄기 (숫자 한 글자만 바꾸면 돼요!)
           메뉴 줄마다 soldOut: 0 이 들어 있어요.
             soldOut: 0  → 판매 중 (평소 모습)
             soldOut: 1  → 오늘 품절! (카드가 흐려지고 '오늘 품절' 표시가 떠요)
           예) 콜드브루가 다 떨어졌다면 콜드브루 줄에서 soldOut: 0 을 soldOut: 1 로 바꾸세요.
           다시 팔 때는 1 을 0 으로 되돌리면 끝이에요.
           고친 뒤 저장(Ctrl + S) → 새로고침(F5) 하는 것 잊지 마세요.
           메뉴를 새로 추가할 때도 줄을 복사하면 soldOut: 0 이 같이 따라와요.

       ▶ 새 칸(예: "샌드위치")을 만들고 싶을 때
           1) 아래 categories 목록에 "샌드위치" 를 추가하세요.
           2) 새 메뉴 줄의 category 도 "샌드위치" 로 똑같이 쓰세요.

       ▶ 고친 뒤에는 저장(Ctrl + S)하고, 브라우저에서 새로고침(F5) 하면 바뀐 게 보여요.
       ▶ 화면이 하얗게 되거나 메뉴가 안 보이면: 쉼표(,)나 따옴표(")를 빠뜨렸을 가능성이 커요.
         방금 고친 줄을 앞뒤 줄과 비교해 보세요.
       ========================================================================== */

    // ───────────── 칸(카테고리) 목록 : 화면에 보이는 버튼 순서 그대로예요 ─────────────
    // 칸 이름을 바꾸면 아래 메뉴들의 category 도 같은 이름으로 바꿔야 해요.
    const categories = ["커피", "논커피", "디저트"];

    // ───────────── 메뉴 목록 ─────────────
    const menus = [

      // ===== [커피] 칸 =====
      { category: "커피", name: "아메리카노", price: 4500, soldOut: 0, desc: "산미가 적은 고소한 원두" },
      { category: "커피", name: "카페라떼", price: 5000, soldOut: 1, desc: "부드러운 우유 거품" },
      { category: "커피", name: "바닐라 라떼", price: 5500, soldOut: 0, desc: "바닐라빈을 직접 우려낸 시럽" },
      { category: "커피", name: "아인슈페너", price: 5800, soldOut: 0, desc: "단맛을 줄인 수제 크림", best: true },
      { category: "커피", name: "콜드브루", price: 5300, soldOut: 0, desc: "12시간 저온 추출, 목넘김이 깔끔함" },
      { category: "커피", name: "디카페인 아메리카노", price: 5000, soldOut: 0, desc: "카페인 걱정 없이 편하게" },
      // ↑ [커피] 칸에 메뉴를 더 넣고 싶으면 바로 위 줄을 복사해서 여기에 붙이세요.

      // ===== [논커피] 칸 =====
      { category: "논커피", name: "흑임자 라떼", price: 5500, soldOut: 0, desc: "국산 흑임자를 직접 갈아 넣음", best: true },
      { category: "논커피", name: "말차 라떼", price: 5800, soldOut: 0, desc: "우지 말차, 쌉싸름한 맛이 진함" },
      { category: "논커피", name: "쑥 라떼", price: 5500, soldOut: 0, desc: "강화도 쑥, 은은하고 담백함" },
      { category: "논커피", name: "곡물 라떼", price: 5300, soldOut: 0, desc: "볶은 곡물의 구수한 맛" },
      { category: "논커피", name: "자몽에이드", price: 6000, soldOut: 0, desc: "생과일 자몽 과육을 그대로" },
      // ↑ [논커피] 칸에 메뉴를 더 넣고 싶으면 바로 위 줄을 복사해서 여기에 붙이세요.

      // ===== [디저트] 칸 =====
      { category: "디저트", name: "치즈케이크", price: 6500, soldOut: 0, desc: "굽지 않은 부드러운 식감" },
      { category: "디저트", name: "당근케이크", price: 6000, soldOut: 0, desc: "견과류를 넉넉히 넣음" },
      { category: "디저트", name: "스콘", price: 4000, soldOut: 0, desc: "겉은 바삭 속은 촉촉, 잼과 함께" },
      { category: "디저트", name: "바스크 치즈케이크", price: 6800, soldOut: 0, desc: "겉면을 진하게 태운 풍미" }
      // ↑ 여기가 목록의 맨 마지막 줄이라 끝에 쉼표가 없어요.
      //   [디저트] 칸에 메뉴를 더 넣으려면: 이 줄 끝에 쉼표(,)를 붙이고, 그 아래에 새 줄을 쓰세요.
      //   (새로 넣은 줄이 맨 마지막이 되니까 그 줄 끝은 쉼표 없이 두세요)

    ];
  </script>

  <style>
    /* ===== 색깔 설정 =====
       [고치는 곳] 가게 색깔을 바꾸고 싶으면 아래 두 줄의 #번호만 바꾸세요. */
    :root {
      --green-light: #C8E0B0;  /* 연한 연두: 배경 */
      --green: #5E8B3F;        /* 진한 연두: 선택된 버튼, 가격, 전화 버튼 */
      --cream: #F5EFE6;        /* 크림색: 카드, 본문 */
      --ink: #2F3A25;          /* 글자색: 아주 진한 초록빛 갈색 */

      /* 예전 갈색 디자인 값 (되돌리고 싶을 때 참고하세요)
         --brown: #4A3728;   진한 갈색: 배경, 제목 */
      --brown: #4A3728;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      /* 글꼴: 고운 돋움 먼저, 없으면 맑은 고딕 */
      font-family: "고운 돋움", "GowunDodum", "Gowun Dodum", "맑은 고딕", "Malgun Gothic", sans-serif;
      color: var(--ink);
      /* 은은한 그라데이션: 연한 연두 → 크림. 둥근 빛 번짐을 겹쳐서 유리 느낌을 살려요 */
      background:
        radial-gradient(circle at 15% 8%, rgba(255, 255, 255, 0.7) 0, transparent 40%),
        radial-gradient(circle at 90% 35%, rgba(94, 139, 63, 0.28) 0, transparent 45%),
        radial-gradient(circle at 10% 85%, rgba(200, 224, 176, 0.9) 0, transparent 50%),
        linear-gradient(160deg, var(--green-light) 0%, #E3EDD3 50%, var(--cream) 100%);
      /* background-attachment: fixed;  ← 아이폰에서 버벅여서 껐어요 (지우지 않고 남겨둠) */
      min-height: 100vh;
      line-height: 1.6;
      /* 아이폰을 가로로 돌렸을 때 글자가 저절로 커지는 것을 막아요 */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      /* 버튼을 눌렀을 때 생기는 어두운 네모 표시를 없애요 */
      -webkit-tap-highlight-color: transparent;
    }

    /* 휴대폰 폭(390px)에 맞춘 가운데 영역 */
    .wrap {
      max-width: 430px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }

    /* ===== 유리 카드 (글래스모피즘) ===== */
    .card {
      background: rgba(245, 239, 230, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(70, 100, 50, 0.16);
      padding: 26px 22px;
      margin-bottom: 18px;
    }

    /* ===== 1. 맨 위: 가게 이름 ===== */
    .header { text-align: center; }
    .header h1 { font-size: 32px; letter-spacing: 1px; color: var(--green); }
    .header .intro { margin-top: 8px; font-size: 17px; }
    .header .place { margin-top: 6px; font-size: 15px; opacity: 0.7; }

    /* ===== 2. 가운데: 메뉴 ===== */
    /* 카테고리 버튼: 가로로 한 줄, 손가락으로 누르기 편한 크기 */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab {
      flex: 1;
      min-height: 52px;
      padding: 0 4px;
      font-family: inherit;
      font-size: 17px;
      color: var(--ink);
      background: rgba(245, 239, 230, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(70, 100, 50, 0.12);
      cursor: pointer;
    }
    /* 지금 선택된 버튼: 진한 연두 바탕 + 흰 글씨로 확 달라 보이게 */
    .tab.active {
      color: #fff;
      background: var(--green);
      border-color: var(--green);
      font-weight: bold;
      box-shadow: 0 6px 16px rgba(94, 139, 63, 0.4);
    }

    /* ----- 휴대폰 사용 편의 보완 ----- */
    /* 카테고리 버튼 줄을 화면 위에 고정: 스크롤해도 따라와요 */
    .tabs {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 0 -18px 12px;      /* 양옆으로 화면 끝까지 */
      padding: 10px 18px;
      background: rgba(227, 237, 211, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    /* 버튼: 연달아 눌러도 화면이 확대되지 않게, 누르면 살짝 눌리는 효과 */
    .tab, .call-btn { touch-action: manipulation; transition: transform 0.1s; }
    .tab:active, .call-btn:active { transform: scale(0.96); }

    /* 칸 제목 (전체 보기에서 '커피', '논커피', '디저트'를 나눠 줘요) */
    .cat-title {
      margin: 8px 4px 12px;
      font-size: 20px;
      font-weight: bold;
      color: var(--green);
    }
    .cat-title:not(:first-child) { margin-top: 26px; }

    /* 메뉴 하나하나가 반투명한 카드예요 */
    .menu-item {
      background: rgba(245, 239, 230, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(70, 100, 50, 0.14);
      padding: 20px 20px;
      margin-bottom: 14px;
    }
    /* 시그니처 메뉴 카드: 살짝 더 진하게 + 연두 테두리와 그림자로 강조 */
    .menu-item.signature {
      background: rgba(245, 239, 230, 0.85);
      border: 2px solid var(--green);
      box-shadow: 0 10px 28px rgba(94, 139, 63, 0.3);
    }
    /* 품절 메뉴 카드: 흐리게 보이고, 가격에는 취소선 */
    .menu-item.sold-out { opacity: 0.5; }
    .menu-item.sold-out .menu-price { text-decoration: line-through; }
    .menu-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .menu-name { font-size: 18px; font-weight: bold; }
    /* 가격: 조금 크고 진하게, 진한 연두색 */
    .menu-price {
      font-size: 20px;
      font-weight: bold;
      color: var(--green);
      white-space: nowrap;
    }
    .menu-desc { margin-top: 6px; font-size: 15px; opacity: 0.78; }
    .badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: normal;
      color: #fff;
      background: var(--green);
      border-radius: 999px;
      vertical-align: middle;
    }
    /* '오늘 품절' 배지: 회색빛 갈색으로 차분하게 */
    .badge.sold {
      background: #7a6a5a;
    }

    /* 이름이 길어도 줄바꿈되고, 배지는 이름 아래에 가지런히 놓여요 */
    .menu-name { min-width: 0; overflow-wrap: anywhere; }
    .menu-name .badge {
      display: block;
      width: fit-content;
      margin: 6px 0 0 0;
    }
    .menu-desc { overflow-wrap: anywhere; }

    /* 가로 화면처럼 높이가 낮을 때는 버튼 줄을 고정하지 않아요 (공간 확보) */
    @media (max-height: 500px) {
      .tabs { position: static; }
    }

    /* ===== 3. 맨 아래: 영업시간, 전화 ===== */
    .info h2 { font-size: 19px; margin-bottom: 10px; color: var(--green); }
    .info p { font-size: 16px; }
    .info .gap { margin-top: 20px; }

    .call-btn {
      display: block;
      margin-top: 24px;
      padding: 18px 0;
      text-align: center;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: var(--green);
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(94, 139, 63, 0.4);
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- ===== 1. 맨 위: 가게 이름과 한 줄 소개 =====
         [고치는 곳] 글자만 바꾸시면 됩니다. -->
    <header class="card header">
      <h1>브릿지 커피</h1>
      <p class="intro">매일 직접 볶는 스페셜티 커피</p>
      <p class="place">광주 북구 비엔날레</p>
    </header>

    <!-- ===== 2. 가운데: 메뉴 목록 ===== -->
    <nav class="tabs" id="tabs"></nav>
    <section id="menuList"></section>

    <!-- ===== 3. 맨 아래: 영업시간, 안내, 전화 걸기 ===== -->
    <footer class="card info">
      <h2>영업시간</h2>
      <!-- [고치는 곳] 영업시간 -->
      <p>평일 08:00 ~ 21:00</p>
      <p>주말 10:00 ~ 20:00</p>
      <p>목요일 휴무</p>

      <h2 class="gap">안내</h2>
      <!-- [고치는 곳] 주차, 인스타, 좌석 안내 -->
      <p>주차 2대 가능</p>
      <p>인스타그램 @bridge_coffee</p>
      <p>1인 좌석 6석</p>

      <!-- [고치는 곳] 전화번호는 아래 tel: 뒤와 버튼 글자 두 군데를 같이 바꾸세요. -->
      <a class="call-btn" href="tel:062-000-0000">전화 걸기 (062-000-0000)</a>
    </footer>

  </div>

  <script>
    /* ===== 여기서부터는 화면을 그리는 부분이에요 =====
       메뉴 목록(menus)과 칸 목록(categories)은 파일 맨 위쪽으로 옮겨 두었어요.
       메뉴를 고칠 때는 이 아래를 건드리지 말고, 파일 맨 위의 '★ 메뉴 정보' 부분을 고치세요. */

    const tabsEl = document.getElementById("tabs");
    const listEl = document.getElementById("menuList");

    // 가격을 "4,500원" 모양으로 바꿔 주는 함수
    function formatPrice(n) {
      return n.toLocaleString("ko-KR") + "원";
    }

    // 맨 앞에 붙는 '전체' 버튼의 이름. [고치는 곳] 다른 글자로 바꿔도 돼요.
    const ALL = "전체";

    // 메뉴 하나를 카드로 만들어 화면에 붙이는 함수
    function addMenuItem(m) {
        const item = document.createElement("div");
        item.className = "menu-item";
        if (m.best) item.classList.add("signature");     // 시그니처 메뉴 카드 강조
        if (m.soldOut) item.classList.add("sold-out");   // 품절이면 흐리게 (soldOut: 1)

        const top = document.createElement("div");
        top.className = "menu-top";

        const name = document.createElement("span");
        name.className = "menu-name";
        name.textContent = m.name;
        if (m.best) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = "시그니처 메뉴";
          name.appendChild(badge);
        }
        if (m.soldOut) {
          const sold = document.createElement("span");
          sold.className = "badge sold";
          sold.textContent = "오늘 품절";
          name.appendChild(sold);
        }

        const price = document.createElement("span");
        price.className = "menu-price";
        price.textContent = formatPrice(m.price);

        top.append(name, price);

        const desc = document.createElement("p");
        desc.className = "menu-desc";
        desc.textContent = m.desc;

        item.append(top, desc);
        listEl.appendChild(item);
    }

    // 선택한 칸의 메뉴를 화면에 그리는 함수 ('전체'를 고르면 모든 칸을 차례로 보여줘요)
    function showCategory(cat) {
      listEl.innerHTML = "";

      if (cat === ALL) {
        // 맨 위: 시그니처 메뉴(best: true)만 따로 모아서 보여줘요
        // [고치는 곳] 칸 제목 글자는 아래 "시그니처 메뉴"만 바꾸면 돼요.
        if (menus.some(m => m.best)) {
          const sigTitle = document.createElement("h2");
          sigTitle.className = "cat-title";
          sigTitle.textContent = "시그니처 메뉴";
          listEl.appendChild(sigTitle);
          menus.filter(m => m.best).forEach(addMenuItem);
        }

        // 그 아래: 칸마다 제목을 달고 그 칸의 메뉴를 보여줘요
        categories.forEach(c => {
          const title = document.createElement("h2");
          title.className = "cat-title";
          title.textContent = c;
          listEl.appendChild(title);
          menus.filter(m => m.category === c).forEach(addMenuItem);
        });
      } else {
        menus.filter(m => m.category === cat).forEach(addMenuItem);
      }

      // 눌린 버튼 표시 바꾸기
      tabsEl.querySelectorAll(".tab").forEach(b => {
        b.classList.toggle("active", b.textContent === cat);
      });
    }

    // 칸 버튼 만들기 ('전체' 버튼이 맨 앞에 와요)
    [ALL, ...categories].forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "tab";
      btn.textContent = cat;
      btn.addEventListener("click", () => showCategory(cat));
      tabsEl.appendChild(btn);
    });

    // 처음 들어오면 '전체'가 선택된 상태로 보여줘요
    showCategory(ALL);
  </script>
</body>
</html>
